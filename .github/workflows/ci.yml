name: BEC app checks

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            webapp
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check webapp/app.js
          node --check webapp/staff-login.js
          node --check webapp/staff.js
          node --check webapp/config.js
      - name: Validate catalog and app
        run: python -m unittest discover -s webapp/tests -v
